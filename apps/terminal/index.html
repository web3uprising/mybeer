<!doctype html>
<html lang="pt" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="google" content="notranslate">
  <title>Terminal Moeda</title>
  <link rel="stylesheet" href="https://api.fontshare.com/css?f%5B%5D=switzer@400,500,600&display=swap">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <main class="app">
    <header class="bar no-print">
      <span id="shop-name">terminal</span>
      <button id="open-settings" type="button">definições</button>
    </header>

    <section data-screen="beers" hidden>
      <p class="eyebrow">mybeer · terminal</p>
      <h1>Quantas <em>cervejas</em>?</h1>
      <div class="beer-count">
        <button class="round" id="beers-less" type="button" aria-label="Menos uma">−</button>
        <span class="big" id="beers">1</span>
        <button class="round" id="beers-more" type="button" aria-label="Mais uma">+</button>
      </div>
      <div class="quick" id="beers-quick">
        <button type="button">1</button><button type="button">2</button><button type="button">3</button>
        <button type="button">4</button><button type="button">5</button><button type="button">6</button>
      </div>
      <div class="actions push">
        <button class="secondary" id="open-history" type="button">Vendas</button>
        <button class="primary" id="choose-coin" type="button">Escolher moeda</button>
      </div>
    </section>

    <section data-screen="coins" hidden>
      <h2>Pagar <em>com</em></h2>
      <p class="eyebrow" id="coins-beers"></p>
      <div class="coin-list" id="coin-list"></div>
      <p class="muted" id="coins-status"></p>
      <button class="secondary push" id="coins-back" type="button">Voltar</button>
    </section>

    <section data-screen="charge" hidden>
      <div class="charge-head">
        <p class="eyebrow" id="charge-beers"></p>
        <span class="big green" id="charge-amount"></span>
      </div>
      <div class="qr" id="charge-qr"></div>
      <p class="muted" id="charge-status"></p>
      <button class="secondary push" id="charge-cancel" type="button">Cancelar</button>
    </section>

    <section data-screen="paid" hidden>
      <div class="paper" id="receipt">
        <strong class="paper-shop" id="receipt-shop"></strong>
        <span class="muted" id="receipt-date"></span>
        <hr>
        <div class="row"><span id="receipt-items"></span><span class="value" id="receipt-amount"></span></div>
        <div class="row"><span class="label">Total</span><span class="big green" id="receipt-total"></span></div>
        <hr>
        <div class="row"><span class="label">Venda</span><span class="value mono" id="receipt-sale"></span></div>
        <div class="qr" id="receipt-qr"></div>
        <span class="label">Recibo</span>
      </div>
      <div class="actions push no-print">
        <button class="secondary" id="print" type="button">Imprimir</button>
        <button class="primary" id="new-sale" type="button">Nova venda</button>
      </div>
    </section>

    <section data-screen="history" hidden>
      <h2><em>Vendas</em></h2>
      <div class="card">
        <div class="row"><span class="label">Total hoje</span><span class="value green" id="history-total"></span></div>
        <div class="row"><span class="label">Cervejas hoje</span><span class="value" id="history-beers"></span></div>
        <span class="label">Saldo do terminal</span>
        <a class="value link" id="history-balance" target="_blank" rel="noopener"></a>
      </div>
      <div class="log" id="history-list"></div>
      <button class="secondary push" id="history-back" type="button">Voltar</button>
    </section>

    <section data-screen="settings" hidden>
      <h2><em>Definições</em></h2>
      <label class="field">
        <span class="label">Nome da loja</span>
        <input id="settings-name" placeholder="Bar da AEFEUP" autocomplete="off">
      </label>
      <div class="card">
        <span class="label">Endereço que recebe</span>
        <div class="qr small" id="settings-qr"></div>
        <div class="row">
          <a class="value mono link" id="settings-address" target="_blank" rel="noopener"></a>
          <button class="chip" id="settings-copy" type="button">Copiar</button>
        </div>
        <span class="label">Moedas aceites</span>
        <span class="value" id="settings-coins"></span>
      </div>
      <details>
        <summary>Registo de moedas</summary>
        <div class="row" style="margin-top:10px">
          <a class="value mono link" id="settings-registry" target="_blank" rel="noopener"></a>
          <button class="chip" id="registry-copy" type="button">Copiar</button>
        </div>
      </details>
      <details>
        <summary>Levantar saldo para outra carteira</summary>
        <div class="stack" style="margin-top:10px">
          <input id="withdraw-to" placeholder="0x… destino" autocomplete="off" spellcheck="false">
          <button class="secondary" id="withdraw" type="button" disabled>Enviar tudo</button>
          <p class="muted">Precisa de um pouco de PAS no terminal para pagar a rede.</p>
        </div>
      </details>
      <button class="primary push" id="settings-back" type="button">Voltar</button>
    </section>
  </main>
  <div class="confirm no-print" id="confirm" role="status" hidden>
    <span class="check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <span class="success-mark">Pago</span>
    <span class="big green" id="confirm-amount"></span>
    <span class="muted" id="confirm-beers"></span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
